<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forage Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="app-shell flex h-screen overflow-hidden">
    <button
      id="sidebar-toggle"
      class="mobile-nav-toggle"
      type="button"
      aria-label="Open navigation"
      aria-controls="app-sidebar"
      aria-expanded="false"
    >
      <span class="mobile-nav-toggle-lines" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside id="app-sidebar" class="app-sidebar flex w-60 shrink-0 flex-col text-slate-300">
      <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-800">
        <span class="brand-mark">F</span>
        <span>
          <span class="block text-sm font-semibold tracking-wide text-white">Forage Console</span>
          <span class="view-kicker">Website discovery</span>
        </span>
      </div>
      <nav id="sidebar-nav" class="flex-1 space-y-1 px-3 py-4 text-sm">
        <a href="#/dashboard"  data-nav="dashboard"  class="nav-link block px-3 py-2.5">Dashboard</a>
        <a href="#/companies"  data-nav="companies"  class="nav-link block px-3 py-2.5">Companies</a>
        <a href="#/new-run"    data-nav="new-run"    class="nav-link block px-3 py-2.5">New Run</a>
        <a href="#/runs"       data-nav="runs"       class="nav-link block px-3 py-2.5">Runs</a>
        <a href="#/operations" data-nav="operations" class="nav-link block px-3 py-2.5">Operations</a>
        <a href="#/tools"      data-nav="tools"      class="nav-link block px-3 py-2.5">Tools</a>
      </nav>
      <div class="px-5 py-4 text-xs text-slate-500 border-t border-slate-800">
        <span class="view-kicker">Internal tool</span>
      </div>
    </aside>

    <!-- Main area -->
    <div class="flex flex-1 flex-col overflow-hidden">
      <header class="app-header flex h-16 shrink-0 items-center px-8">
        <div>
          <p class="view-kicker">Control plane</p>
          <h1 id="view-title" class="text-lg font-semibold text-slate-100">Dashboard</h1>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto px-6 py-6 lg:px-8">
        <section data-view="dashboard"  class="content-wrap hidden"></section>
        <section data-view="companies"  class="content-wrap hidden"></section>
        <section data-view="new-run"    class="content-wrap hidden"></section>
        <section data-view="runs"       class="content-wrap hidden"></section>
        <section data-view="run-detail" class="content-wrap hidden"></section>
        <section data-view="operations" class="content-wrap hidden"></section>
        <section data-view="tools"      class="content-wrap hidden"></section>
      </main>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
